<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — OurDrive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-color: #111113;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .error-card {
            text-align: center;
            padding: 48px 56px;
            background: #232327;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            max-width: 460px;
            width: 90%;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { transform: translateY(16px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .error-icon {
            font-size: 56px;
            margin-bottom: 20px;
            display: block;
        }
        .error-code {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #f85149;
            background: rgba(248,81,73,0.12);
            border: 1px solid rgba(248,81,73,0.25);
            border-radius: 99px;
            padding: 4px 14px;
            display: inline-block;
            margin-bottom: 18px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0f0f5;
            letter-spacing: -0.03em;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #9898a6;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            background: #6ea8fe;
            color: #0a0f1e;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.18s ease, transform 0.1s;
        }
        a:hover { background: #89b8ff; }
        a:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="error-icon">🔒</span>
        <span class="error-code">403 Forbidden</span>
        <h1>Access Denied</h1>
        <p>You don't have permission to access this file.<br>Please contact the owner or go back to your drive.</p>
        <a href="../index.html">← Back to OurDrive</a>
    </div>
</body>
</html>
